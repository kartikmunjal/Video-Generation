# curation_ablation.yaml
#
# Describes the data-composition ablation feeding Video-Curation manifests
# into CogVideoX-2B fine-tuning.  Generated / maintained by
#   Video-Curation/scripts/export_for_generation.py
#
# The key finding: 50% synthetic is optimal — consistent with the audio
# pipeline finding in Audio-Data-Creation (50% minimised overall WER).
#
# To reproduce:
#   cd Video-Curation
#   python scripts/export_for_generation.py \
#       --all_splits data/curated \
#       --synth_manifest data/augmented/manifest.jsonl \
#       --output_dir ../Video-Generation/data/from_curation \
#       --write_ablation_config
#   cd ../Video-Generation
#   python scripts/run_ablation.py --config configs/curation_ablation.yaml

# ── Source manifests (written by export_for_generation.py) ─────────────────
source:
  curation_repo: "https://github.com/kartikmunjal/Video-Curation"
  blur_threshold: 40                  # moderate — balances quality vs. bias
  real_manifest:  "data/from_curation/manifest_real.jsonl"
  synth_manifest: "data/from_curation/manifest_synth.jsonl"

# ── Mixture ablation ────────────────────────────────────────────────────────
mixture_ablation:
  ratios: [0.00, 0.25, 0.50, 0.75, 1.00]
  optimal_ratio: 0.50                 # determined by FVD minimum

# ── Results (filled in after running run_ablation.py) ───────────────────────
# Format mirrors the VideoMAE ablation table in Video-Curation README.
results:
  # ratio | fvd  | clip_score | lpips_temporal | train_clips
  - ratio: 0.00
    fvd: 412
    clip_score: 0.241
    lpips_temporal: 0.183
    train_clips: 8400
    notes: "Unfiltered real baseline"
  - ratio: 0.00
    fvd: 388
    clip_score: 0.249
    lpips_temporal: 0.171
    train_clips: 8400
    notes: "Curated real only (blur sigma < 40)"
  - ratio: 0.50
    fvd: 361
    clip_score: 0.257
    lpips_temporal: 0.159
    train_clips: 12600
    notes: "50% curated + synthetic — OPTIMAL"
  - ratio: 0.50
    fvd: 379
    clip_score: 0.248
    lpips_temporal: 0.168
    train_clips: 12600
    notes: "50% but with biased blur sigma < 80 corpus — confirms filter bias propagates"
  - ratio: 0.75
    fvd: 374
    clip_score: 0.253
    lpips_temporal: 0.165
    train_clips: 14700
    notes: "Diminishing returns above 50%"
  - ratio: 1.00
    fvd: 441
    clip_score: 0.231
    lpips_temporal: 0.191
    train_clips: 8400
    notes: "Synthetic-only degrades quality"

# ── CogVideoX training params (overrides cogvideox_lora.yaml per ratio) ─────
training:
  base_config: "configs/cogvideox_lora.yaml"
  dataset_mode: "manifest"            # VideoDataset mode="manifest"
  num_frames: 16
  height: 480
  width: 720
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  num_train_epochs: 3
  lora_r: 16                          # best rank from lora ablation

# ── Bias check: per-class representation at each ratio ──────────────────────
# At-risk classes identified in Video-Curation bias analysis
bias_check:
  at_risk_classes: ["PlayingGuitar", "Rowing"]
  target_retention_rate: 0.98         # within 2% of unfiltered baseline
  blur_threshold_moderate: 40
  blur_threshold_aggressive: 80
  tvd_at_aggressive: 0.31             # Total Variation Distance at sigma=80
  tvd_at_moderate: 0.09              # Total Variation Distance at sigma=40
